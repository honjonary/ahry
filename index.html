<style>
:root{--bg1:#fff1f6;--bg2:#f1e8ff;--bar:rgba(255,255,255,.88);--her:#ffffff;--herink:#2d2230;--me:#c93f6f;--meink:#fff;--sub:#8a7686;--line:#ead9e4;--chip:#fff;--chipink:#a8335c;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1d1424;--bg2:#141024;--bar:rgba(34,24,42,.9);--her:#2d2236;--herink:#f6ecf2;--me:#b8365f;--meink:#fff;--sub:#b3a2b0;--line:#3d2f48;--chip:#2d2236;--chipink:#ffb3cc}}
:root[data-theme="dark"]{--bg1:#1d1424;--bg2:#141024;--bar:rgba(34,24,42,.9);--her:#2d2236;--herink:#f6ecf2;--me:#b8365f;--meink:#fff;--sub:#b3a2b0;--line:#3d2f48;--chip:#2d2236;--chipink:#ffb3cc}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;font-family:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:500;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--herink)}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bar);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.av{width:42px;height:42px;border-radius:50%;object-fit:cover;flex:none;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.nm{font-weight:700;font-size:17px;line-height:1.2}.st{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:5px}
.st i{width:8px;height:8px;border-radius:50%;background:#3ccf7a;display:inline-block}
.sp{flex:1}
.hb{font:inherit;font-size:13px;color:var(--chipink);background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:0 12px;min-height:44px;cursor:pointer}
#log{flex:1;overflow-y:auto;padding:14px 12px 6px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.row{display:flex;gap:8px;align-items:flex-end;max-width:100%;animation:in .25s ease-out}
.row.me{justify-content:flex-end}
.row .av{width:34px;height:34px}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.b{max-width:76%;padding:9px 13px;border-radius:18px;line-height:1.5;font-size:15.5px;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.her .b{background:var(--her);color:var(--herink);border-bottom-left-radius:6px}
.me .b{background:var(--me);color:var(--meink);border-bottom-right-radius:6px}
.t{font-size:11px;color:var(--sub);align-self:flex-end;margin-bottom:2px}
.dots{display:flex;gap:4px;padding:4px 2px}.dots span{width:7px;height:7px;border-radius:50%;background:var(--sub);animation:d 1.1s infinite}
.dots span:nth-child(2){animation-delay:.18s}.dots span:nth-child(3){animation-delay:.36s}
@keyframes d{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.note{align-self:center;font-size:12.5px;color:var(--sub);background:var(--bar);border:1px solid var(--line);border-radius:12px;padding:6px 12px;text-align:center}
#chips{display:flex;gap:8px;padding:6px 12px;overflow-x:auto}
.chip{flex:none;font:inherit;font-size:14px;color:var(--chipink);background:var(--chip);border:1px solid var(--line);border-radius:18px;padding:0 14px;min-height:44px;cursor:pointer}
form{display:flex;gap:8px;padding:8px 12px 10px;background:var(--bar);border-top:1px solid var(--line)}
textarea{flex:1;font:inherit;font-size:16px;color:var(--herink);background:var(--her);border:1px solid var(--line);border-radius:20px;padding:11px 15px;resize:none;max-height:120px;min-height:46px;line-height:1.35;outline:none}
textarea:focus{border-color:var(--me)}
#go{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--me);color:#fff;cursor:pointer;align-self:flex-end;display:grid;place-items:center}
#go:disabled{opacity:.4;cursor:default}
.hb:focus-visible,.chip:focus-visible,#go:focus-visible{outline:3px solid #4aa3ff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
.b img.ph{display:block;width:240px;max-width:100%;height:auto;border-radius:12px}
.mbtn{display:block;margin-top:8px;font:inherit;font-size:13px;color:var(--chipink);background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:0 12px;min-height:44px;cursor:pointer}
</style>
</head>

  "현재 시각: "+(d.getMonth()+1)+"월 "+d.getDate()+"일 "+days[d.getDay()]+"요일 "+d.getHours()+"시 "+d.getMinutes()+"분.";

function build(){

  return "";
}

var TXT_URL="https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=";

  var r=await fetch(IMG_URL+encodeURIComponent(key),{method:"POST",headers:{"Content-Type":"application/json"},signal:ctl.signal,
    body:JSON.stringify({contents:[{role:"user",parts:[{text:q}]}],generationConfig:{responseModalities:["TEXT","IMAGE"]}})});
  var d={};try{d=await r.json();}catch(x){}

/* Gemini 이미지 모델을 못 쓸 때: 무료 이미지 서비스(Pollinations)로 대신 만들기 */
async function freeImage(text,key){

        contents:[{role:"user",parts:[{text:text}]}],generationConfig:{thinkingConfig:{thinkingLevel:"minimal"}}})});

}

/* ---- 음악 (브라우저 안에서 합성하는 BGM) ---- */
var ac=null,mus=null,musTmr=null,lastTr=-1;
var TRACKS=[
 {name:"벚꽃 오후",bpm:82,base:60,lead:"triangle",pad:"sine",lv:0.12,hat:true,
  chords:[[0,4,7,11],[-3,0,4,7],[-7,-3,0,4],[-5,-1,2,5]],
  mel:[[16,null,14,null,12,null,7,null],[9,null,12,null,16,null,14,null],[17,null,16,null,12,null,9,null],[14,null,11,null,7,null,11,12]]},
 {name:"PSP 레트로 칩튠",bpm:120,base:57,lead:"square",pad:"triangle",lv:0.06,hat:true,
  chords:[[0,3,7,12],[-4,0,3,8],[3,7,10,15],[-2,2,5,10]],
  mel:[[12,null,15,12,19,null,15,12],[20,null,17,15,12,null,15,17],[15,null,19,15,22,null,19,15],[14,null,17,14,22,null,17,14]]},
 {name:"비 오는 저녁",bpm:68,base:62,lead:"sine",pad:"triangle",lv:0.14,hat:false,
  chords:[[0,3,7,10],[-4,0,3,7],[-7,-4,0,3],[-5,-1,2,5]],
  mel:[[12,null,null,10,null,7,null,null],[7,null,null,12,null,10,null,null],[10,null,null,7,null,3,null,null],[5,null,null,2,null,-1,null,7]]}
];
function musicUnlock(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();}catch(e){}}
function mf(n){return 440*Math.pow(2,(n-69)/12);}
function tone(t,n,dur,type,vol,att){
  var o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.value=mf(n);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+(att||0.02));
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(mus.master);o.start(t);o.stop(t+dur+0.05);
}
function hat(t,vol){
  var len=Math.floor(ac.sampleRate*0.04),b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  var s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=b;f.type="highpass";f.frequency.value=6000;g.gain.value=vol;
  s.connect(f);f.connect(g);g.connect(mus.master);s.start(t);
}
function sched(){
  if(!mus)return;
  var tr=mus.tr,eighth=60/tr.bpm/2;
  while(mus.next<ac.currentTime+0.35){
    var i=mus.step,bar=Math.floor(i/8)%tr.chords.length,s=i%8,ch=tr.chords[bar],t=mus.next;
    if(s===0)ch.forEach(function(n){tone(t,tr.base+n,eighth*8,tr.pad,0.05,0.4);});
    if(s===0||s===4)tone(t,tr.base+ch[0]-12,eighth*3.5,"triangle",0.16,0.01);
    var m=tr.mel[bar][s];if(m!=null)tone(t,tr.base+m,eighth*1.8,tr.lead,tr.lv,0.01);
    if(tr.hat&&s%2===1)hat(t,0.05);
    mus.next+=eighth;mus.step++;
  }
}
function startMusic(tr){
  musicUnlock();if(!ac)return false;
  stopMusic();
  var master=ac.createGain();master.gain.value=0.22;
  var lp=ac.createBiquadFilter();lp.type="lowpass";lp.frequency.value=4500;

function stopMusic(){

async function send(text){

    clearInterval(tmr);

    var out=((res&&res.text)||"").trim()||"음… 잠깐 말문이 막혔어요. 다시 말해줄래요?";
    if(!bubble){ty.remove();bubble=row({r:"a",t:out,ts:Date.now()});}else bubble.textContent=out;
    msgs.push({r:"a",t:out,ts:Date.now()});save();
  }catch(e){
    clearInterval(tmr);ty.remove();
    if(bubble&&bubble.textContent){msgs.push({r:"a",t:bubble.textContent,ts:Date.now()});save();}
    var c=e&&e.code;
    if(c==="badkey"){try{localStorage.removeItem(KEYNAME);}catch(x){}}
    note(c==="nokey"?"Gemini API 키가 없어서 답장을 못 받았어요. 다시 보내면 키를 물어볼게요.":c==="badkey"?"API 키가 올바르지 않아요. 다시 보내면 키를 새로 물어볼게요.":c==="rate_limited"?"요청이 너무 많아요. 잠시 후 다시 보내 주세요.":"답장을 가져오지 못했어요. 다시 보내 주세요."+((e&&e.msg)?" ("+e.msg+")":""));
  }

}
function scheduleNudge(){
